[build-system]
requires = ["setuptools>=77"]  # SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "inpmap"
dynamic = ["version"]
description = "Configuration-driven input remapper (own configuration language, multiple virtual output devices)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["input", "remapper", "keyboard", "gamepad", "evdev", "uinput", "macros", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
# Baseline: 3.11 (PEP 604 unions, dataclasses, enum). Developed and tested on 3.14.
requires-python = ">=3.11"
dependencies = [
    # Parser for the configuration language (docs/configuration.md). Pure Python, MIT.
    "lark>=1.2,<2",
    # Linux backend: reading /dev/input/event* and creating uinput devices.
    # Platform marker keeps a future Windows install from requiring it.
    "evdev; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/unoctanium/InpMap"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
inpmap = "inpmap.cli:main"

[tool.setuptools.dynamic]
version = { attr = "inpmap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inpmap = ["dsl/*.lark", "data/*.inpmap", "data/syntax/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs real /dev/input or /dev/uinput access (not run by default)",
]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/inpmap/_linux_codes.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
